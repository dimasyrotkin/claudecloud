<!doctype html><html><body style="margin:0;background:#fff">
<canvas id="c" width="1600" height="1400"></canvas>
<script>
(async()=>{
const c=document.getElementById('c'),x=c.getContext('2d');
const fams=[['archivo','../assets/fonts/archivo.woff2','62% 125%'],['anybody','../assets/fonts/anybody.woff2','50% 150%'],['mona','../assets/fonts/mona.woff2','75% 125%']];
let y=60;
x.fillStyle='#F2EBDD';x.fillRect(0,0,1600,1400);
for(const [n,u,r] of fams){
  const buf=await (await fetch(u)).arrayBuffer();
  for(const w of [50,62,75,87,100,112,125,150]){
    const f=new FontFace(n+'_w'+w,buf,{stretch:w+'%',weight:'100 900'});await f.load();document.fonts.add(f);
  }
  for(const w of [50,75,100,125,150]){
    x.font='900 64px '+n+'_w'+w; x.fillStyle='#1a1a2e'; x.fillText(n+' '+w+' TOKENS',20,y); y+=78;
  }
  y+=20;
}
// weight test
for(const wt of [300,600,900]){x.font=wt+' 64px anybody_w100';x.fillText('weight '+wt,20,y);y+=78;}
window.done=true;
})();
</script></body></html>
